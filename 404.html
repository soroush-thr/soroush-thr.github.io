<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found | Soroush Taheri</title>
    <meta name="description" content="The page you are looking for could not be found. Return to Soroush Taheri's portfolio home page.">
    <meta name="robots" content="noindex, follow">
    <link rel="canonical" href="https://soroush-thr.github.io/404.html">

    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="images/favicon-16.png">
    <link rel="apple-touch-icon" href="images/apple-touch-icon.png">

    <!-- CSS -->
    <link rel="stylesheet" href="styles.css">

    <!-- Theme initialization script (prevents flash) -->
    <script>
        (function() {
            const savedTheme = localStorage.getItem('theme') || 'dark';
            document.documentElement.setAttribute('data-theme', savedTheme);
        })();
    </script>

    <style>
        .notfound-wrap {
            min-height: 70vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 4rem 1.5rem;
        }
        .notfound-code {
            font-size: 5rem;
            font-weight: 700;
            line-height: 1;
            margin: 0 0 1rem;
        }
    </style>
</head>
<body>
    <div class="notfound-wrap">
        <p class="notfound-code">404</p>
        <h1>Page Not Found</h1>
        <p>The page you're looking for doesn't exist or has moved.</p>
        <p><a href="index.html" class="btn btn-primary">Back to Home</a></p>
    </div>
</body>
</html>
